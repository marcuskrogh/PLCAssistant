# plcassistant_dashboard_version: 3
title: PLCAssistant
views:
  - title: Skid
    path: skid
    icon: mdi:cup-water
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_status
            name: Soft-PLC
          - entity: sensor.plcassistant_mode
            name: Mode
          - entity: sensor.plcassistant_perm_ok
            name: Start permissive
          - entity: sensor.plcassistant_trip_active
            name: Trip active
      - type: markdown
        content: |
          **PLCAssistant** — Soft-PLC skid HMI. Soft-PLC must show **stopped** (not offline) before Start works — if stuck offline, confirm Mosquitto + PLCAssistant App are Started and matching `instance_id`, then Update App / Restart Core. Change the **Level setpoint**, press **Start**, then watch tank level, flow, and speed.
      - type: entities
        title: Operate
        show_header_toggle: false
        entities:
          - entity: button.plcassistant_start
            name: Start
          - entity: button.plcassistant_stop
            name: Stop
          - entity: button.plcassistant_reset
            name: Reset
          - entity: number.plcassistant_sp_level_req
            name: Level setpoint (request)
      - type: entities
        title: Process
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_lt_tank
            name: Tank level
          - entity: sensor.plcassistant_lt_res
            name: Reservoir level
          - entity: sensor.plcassistant_ft_inlet
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Pump speed command
      - type: entities
        title: Active setpoints (Soft-PLC)
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_sp_level
            name: Active level SP
          - entity: sensor.plcassistant_sp_flow
            name: Active flow SP
      - type: history-graph
        title: Tank & flow
        hours_to_show: 1
        entities:
          - entity: sensor.plcassistant_lt_tank
            name: Tank
          - entity: sensor.plcassistant_ft_inlet
            name: Flow
          - entity: sensor.plcassistant_cmd_speed
            name: Speed
