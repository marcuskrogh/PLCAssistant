# plcassistant_dashboard_version: 15
title: PLCAssistant
views:
  - title: Operate
    path: skid
    icon: mdi:cup-water
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_status
            name: Soft-PLC
          - entity: sensor.plcassistant_dynamics_preset
            name: Dynamics preset
          - entity: sensor.plcassistant_mode
            name: Mode
          - entity: sensor.plcassistant_perm_ok
            name: Start ready (when idle)
          - entity: sensor.plcassistant_trip_active
            name: Trip active
      - type: markdown
        content: |
          **PLCAssistant** — Soft-PLC skid HMI (**Operate**). Soft-PLC must show **stopped** (not offline) before Start works. Open the **Dynamics** tab to edit unit-op / ODE **state equations** and Soft-PLC **measurement equations** (App **0.1.26+**). Soft-PLC stays mock-unaware (`HeldProcess`). Process rows are live plant **sensors** (App **0.1.29+**); Numbers remain available for plant nudges. Update App, wait for Core reload, then reopen this board. Confirm Mosquitto + matching `instance_id` if still offline. Change the **Level setpoint**, press **Start**, then watch levels, inlet flow, and pump speed.
      - type: entities
        title: Operate
        show_header_toggle: false
        entities:
          - entity: button.plcassistant_start
            name: Start
          - entity: button.plcassistant_stop
            name: Stop
          - entity: button.plcassistant_reset
            name: Reset
          - entity: number.plcassistant_sp_level_req
            name: Level setpoint (request)
      - type: entities
        title: Process (IN — live simulator)
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_lt_tank_in
            name: Tank level
          - entity: sensor.plcassistant_lt_res_in
            name: Reservoir level
          - entity: sensor.plcassistant_ft_inlet_in
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Pump speed command
      - type: entities
        title: Active setpoints (Soft-PLC)
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_sp_level
            name: Active level SP
          - entity: sensor.plcassistant_sp_flow
            name: Active flow SP
      - type: history-graph
        title: Levels, speed & setpoints
        hours_to_show: 1
        entities:
          - entity: sensor.plcassistant_lt_tank_in
            name: Tank
          - entity: sensor.plcassistant_lt_res_in
            name: Reservoir
          - entity: sensor.plcassistant_ft_inlet_in
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Speed
          - entity: sensor.plcassistant_sp_flow
            name: Flow SP
  - title: Dynamics
    path: dynamics
    icon: mdi:graph-outline
    panel: true
    cards:
      - type: iframe
        url: /api/plcassistant/dynamics/ui
        aspect_ratio: 100%
