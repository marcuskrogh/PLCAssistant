# plcassistant_dashboard_version: 7
title: PLCAssistant
views:
  - title: Skid
    path: skid
    icon: mdi:cup-water
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_status
            name: Soft-PLC
          - entity: sensor.plcassistant_mode
            name: Mode
          - entity: sensor.plcassistant_perm_ok
            name: Start ready (when idle)
          - entity: sensor.plcassistant_trip_active
            name: Trip active
      - type: markdown
        content: |
          **PLCAssistant** — Soft-PLC skid HMI. Soft-PLC must show **stopped** (not offline) before Start works. **Start ready** is On only while idle and healthy; it correctly shows Off while Mode is RUNNING (Start already succeeded). After App Update **0.1.19+**, Level setpoint requests and process tags also sync via a shared config file when MQTT is quiet — change the setpoint, wait a moment, then Active level SP should match. Update App, wait for Core reload, then reopen this board. Confirm Mosquitto + matching `instance_id` if still offline. Change the **Level setpoint**, press **Start**, then watch tank level, flow, speed, and active setpoints.
      - type: entities
        title: Operate
        show_header_toggle: false
        entities:
          - entity: button.plcassistant_start
            name: Start
          - entity: button.plcassistant_stop
            name: Stop
          - entity: button.plcassistant_reset
            name: Reset
          - entity: number.plcassistant_sp_level_req
            name: Level setpoint (request)
      - type: entities
        title: Process
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_lt_tank
            name: Tank level
          - entity: sensor.plcassistant_lt_res
            name: Reservoir level
          - entity: sensor.plcassistant_ft_inlet
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Pump speed command
      - type: entities
        title: Active setpoints (Soft-PLC)
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_sp_level
            name: Active level SP
          - entity: sensor.plcassistant_sp_flow
            name: Active flow SP
      - type: history-graph
        title: Tank & flow
        hours_to_show: 1
        entities:
          - entity: sensor.plcassistant_lt_tank
            name: Tank
          - entity: sensor.plcassistant_ft_inlet
            name: Flow
          - entity: sensor.plcassistant_cmd_speed
            name: Speed
