# plcassistant_dashboard_version: 11
title: PLCAssistant
views:
  - title: Skid
    path: skid
    icon: mdi:cup-water
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_status
            name: Soft-PLC
          - entity: sensor.plcassistant_mode
            name: Mode
          - entity: sensor.plcassistant_perm_ok
            name: Start ready (when idle)
          - entity: sensor.plcassistant_trip_active
            name: Trip active
      - type: markdown
        content: |
          **PLCAssistant** — Soft-PLC skid HMI. Soft-PLC must show **stopped** (not offline) before Start works. **Start ready** is On only while idle and healthy; it correctly shows Off while Mode is RUNNING (Start already succeeded). From App **0.1.23**, the thin integration runs the **skid plant simulator** (unit-op / custom-ODE authoring lands in-code; HA chooser → SWD-143) and publishes tank/reservoir/flow as Soft-PLC **IN** over MQTT. Soft-PLC stays mock-unaware (`HeldProcess`). Plant Numbers display live motion (nudges allowed). Update App, wait for Core reload, then reopen this board. Confirm Mosquitto + matching `instance_id` if still offline. Change the **Level setpoint**, press **Start**, then watch levels, inlet flow, and pump speed.
      - type: entities
        title: Operate
        show_header_toggle: false
        entities:
          - entity: button.plcassistant_start
            name: Start
          - entity: button.plcassistant_stop
            name: Stop
          - entity: button.plcassistant_reset
            name: Reset
          - entity: number.plcassistant_sp_level_req
            name: Level setpoint (request)
      - type: entities
        title: Process (IN — live simulator)
        show_header_toggle: false
        entities:
          - entity: number.plcassistant_lt_tank_in
            name: Tank level
          - entity: number.plcassistant_lt_res_in
            name: Reservoir level
          - entity: number.plcassistant_ft_inlet_in
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Pump speed command
      - type: entities
        title: Active setpoints (Soft-PLC)
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_sp_level
            name: Active level SP
          - entity: sensor.plcassistant_sp_flow
            name: Active flow SP
      - type: history-graph
        title: Levels, speed & setpoints
        hours_to_show: 1
        entities:
          - entity: number.plcassistant_lt_tank_in
            name: Tank
          - entity: number.plcassistant_lt_res_in
            name: Reservoir
          - entity: number.plcassistant_ft_inlet_in
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Speed
          - entity: sensor.plcassistant_sp_flow
            name: Flow SP
