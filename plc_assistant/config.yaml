name: "PLCAssistant"
version: "0.1.40"
slug: plcassistant
description: "Soft-PLC runtime and block editor for Home Assistant OS (SWD-84)"
url: "https://github.com/marcuskrogh/PLCAssistant"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
timeout: 120
watchdog: "http://[HOST]:[PORT:8099]/"
ingress: true
ingress_port: 8099
panel_icon: mdi:memory
panel_title: PLCAssistant
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Block editor (optional exposed host port)"
map:
  - type: data
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  instance_id: default
  mqtt_broker: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  instance_id: str
  mqtt_broker: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
