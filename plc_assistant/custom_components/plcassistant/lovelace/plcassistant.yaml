# plcassistant_dashboard_version: 28
title: PLCAssistant
views:
  - title: Operate
    path: skid
    icon: mdi:cup-water
    cards:
      - type: entities
        title: Status
        show_header_toggle: false
        entities:
          - entity: sensor.plcassistant_status
            name: Soft-PLC
          - entity: sensor.plcassistant_mode
            name: Mode
          - entity: sensor.plcassistant_trip_active
            name: Trip
      - type: entities
        title: Commands
        show_header_toggle: false
        entities:
          - entity: button.plcassistant_start
            name: Start
          - entity: button.plcassistant_stop
            name: Stop
          - entity: button.plcassistant_reset
            name: Reset
      - type: glance
        title: Process
        show_state: true
        entities:
          - entity: sensor.plcassistant_lt_tank_in
            name: Tank level
          - entity: sensor.plcassistant_lt_res_in
            name: Reservoir
          - entity: sensor.plcassistant_ft_inlet_in
            name: Inlet flow
          - entity: sensor.plcassistant_cmd_speed
            name: Pump speed
      - type: custom:plcassistant-pid-card
        entity: sensor.plcassistant_pid_level
        title: Level PID
      - type: custom:plcassistant-pid-card
        entity: sensor.plcassistant_pid_flow
        title: Flow PID
  - title: Dynamics
    path: dynamics
    icon: mdi:graph-outline
    panel: true
    cards:
      - type: iframe
        url: /api/plcassistant/dynamics/ui
        aspect_ratio: 100%
  - title: Datablocks
    path: datablocks
    icon: mdi:database-outline
    panel: true
    cards:
      - type: iframe
        url: /api/plcassistant/datablocks/ui
        aspect_ratio: 100%
