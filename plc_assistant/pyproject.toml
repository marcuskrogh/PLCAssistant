[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plcassistant"
version = "0.1.0"
description = "Virtual PLC for Home Assistant — wedge mock core (SWD-83)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "PyYAML>=6.0"]
mqtt = ["paho-mqtt>=1.6"]

[tool.setuptools.packages.find]
include = ["plcassistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not live\""
markers = [
  "live: requires cloud HA stack (Mosquitto + HA Core + Soft-PLC)",
  "live_integration: live App ↔ thin-integration tests",
  "live_system: live end-to-end system tests",
]
